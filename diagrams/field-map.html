<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · zoned</p>
    <h1>How the twelve families of AI vocabulary relate</h1>

    <svg viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fieldmap-title fieldmap-desc">
      <title id="fieldmap-title">Field map of AI terminology</title>
      <desc id="fieldmap-desc">The twelve sections of the glossary grouped into four stages — foundations, build, operate and govern — with term counts per section. Agents and orchestration, and safety, security and governance, are the two largest families. Governance findings feed back into how systems are built.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== zones (painted before arrows and nodes) ===== -->
      <!-- A: Foundations -->
      <rect x="40" y="98" width="260" height="188" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="56" y="102" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="60" y="111" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FOUNDATIONS</text>
      <!-- B: Build -->
      <rect x="340" y="98" width="260" height="348" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="356" y="102" width="46" height="12" rx="2" fill="#f5f5f5"/>
      <text x="360" y="111" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BUILD</text>
      <!-- C: Operate -->
      <rect x="640" y="98" width="260" height="268" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="656" y="102" width="62" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="111" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OPERATE</text>
      <!-- D: Govern -->
      <rect x="940" y="98" width="260" height="268" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="956" y="102" width="54" height="12" rx="2" fill="#f5f5f5"/>
      <text x="960" y="111" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GOVERN</text>

      <!-- ===== arrows (before nodes) ===== -->
      <!-- stage progression: sits in the gap between zones, inside every zone's vertical span -->
      <line x1="300" y1="242" x2="332" y2="242" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="242" x2="632" y2="242" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="900" y1="242" x2="932" y2="242" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- feedback: Govern -> Build, leaving zone D's bottom edge and running below every zone -->
      <path d="M 1070,366 V 492 Q 1070,500 1062,500 H 478 Q 470,500 470,492 V 454"
            fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="736" y="474" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="780" y="483" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONSTRAINS</text>

      <!-- ===== nodes ===== -->
      <!-- A -->
      <rect x="60" y="130" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="130" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="136" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="260" y="145" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">17</text>
      <text x="76" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Foundations &amp; model types</text>
      <text x="76" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§1 · transformer · tokens</text>

      <rect x="60" y="210" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="210" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="216" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="260" y="225" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">22</text>
      <text x="76" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Training &amp; adaptation</text>
      <text x="76" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§2 · RLHF · LoRA · PEFT</text>

      <!-- B -->
      <rect x="360" y="130" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="130" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="548" y="136" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="560" y="145" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">11</text>
      <text x="376" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Prompting &amp; context</text>
      <text x="376" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§3 · CoT · context window</text>

      <rect x="360" y="210" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="210" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="548" y="216" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="560" y="225" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">16</text>
      <text x="376" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Retrieval &amp; RAG</text>
      <text x="376" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§4 · chunking · reranking</text>

      <rect x="360" y="290" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="290" width="220" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="548" y="296" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="560" y="305" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">22</text>
      <text x="376" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Agents &amp; orchestration</text>
      <text x="376" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§5 · 41 internal links</text>

      <rect x="360" y="370" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="370" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="548" y="376" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="560" y="385" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">10</text>
      <text x="376" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Tools &amp; protocols</text>
      <text x="376" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§7 · MCP · function calls</text>

      <!-- C -->
      <rect x="660" y="130" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="130" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="848" y="136" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="860" y="145" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">19</text>
      <text x="676" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Serving &amp; inference</text>
      <text x="676" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§9 · KV cache · batching</text>

      <rect x="660" y="210" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="210" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="848" y="216" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="860" y="225" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">16</text>
      <text x="676" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">MLOps &amp; lifecycle</text>
      <text x="676" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§10 · registry · drift</text>

      <rect x="660" y="290" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="290" width="220" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="848" y="296" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="860" y="305" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">14</text>
      <text x="676" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Evaluation</text>
      <text x="676" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§8 · judges · benchmarks</text>

      <!-- D -->
      <rect x="960" y="130" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="130" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="1148" y="136" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1160" y="145" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">12</text>
      <text x="976" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Autonomy &amp; oversight</text>
      <text x="976" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§6 · HITL · ladders</text>

      <rect x="960" y="210" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="210" width="220" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="1148" y="216" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="1160" y="225" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">24</text>
      <text x="976" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Safety &amp; governance</text>
      <text x="976" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§11 · 52 internal links</text>

      <rect x="960" y="290" width="220" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="290" width="220" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="1148" y="296" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1160" y="305" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
      <text x="976" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Failure modes</text>
      <text x="976" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§12 · thinnest section</text>

      <!-- ===== legend ===== -->
      <line x1="40" y1="552" x2="1240" y2="552" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="570" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="130" y="560" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="152" y="569" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Largest family</text>
      <rect x="290" y="560" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="569" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Core section</text>
      <rect x="450" y="560" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="472" y="569" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Cross-cutting</text>
      <rect x="616" y="564" width="24" height="2" rx="1" fill="#4f5d75"/>
      <text x="650" y="569" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Stage order</text>
      <line x1="790" y1="565" x2="814" y2="565" stroke="#eb6c36" stroke-width="1.6" stroke-dasharray="5,4"/>
      <text x="824" y="569" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Governance feeds back into build</text>
      <text x="1240" y="569" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">BADGE = TERMS IN SECTION</text>
    </svg>
  </div>
</body>
</html>
