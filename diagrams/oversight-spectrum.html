<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oversight Spectrum</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · linear</p>
    <h1>Where the human sits, and what moves when you slide along</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oversight-title oversight-desc">
      <title id="oversight-title">The three oversight positions</title>
      <desc id="oversight-desc">Three positions for human oversight of an AI system — human-in-the-loop, human-on-the-loop, and full autonomy — shown left to right. Moving right buys speed and widens the blast radius of a mistake. Accountability is drawn as a fixed band beneath all three, because it does not shift with autonomy.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== arrows first ===== -->
      <line x1="280" y1="166" x2="332" y2="166" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="166" x2="632" y2="166" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== the three positions ===== -->
      <rect x="40" y="118" width="240" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="118" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="52" y="126" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="70" y="135" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HITL</text>
      <text x="52" y="160" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Human-in-the-loop</text>
      <text x="52" y="182" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">approval BEFORE the action</text>
      <text x="52" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">human is a gate</text>

      <rect x="340" y="118" width="240" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="118" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="352" y="126" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="370" y="135" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOTL</text>
      <text x="352" y="160" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Human-on-the-loop</text>
      <text x="352" y="182" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">machine may initiate</text>
      <text x="352" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">human monitors, intervenes</text>

      <rect x="640" y="118" width="240" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="118" width="240" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="652" y="126" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="676" y="135" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOTL</text>
      <text x="652" y="160" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Full autonomy</text>
      <text x="652" y="182" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">post-action review ONLY</text>
      <text x="652" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">human reads the log</text>

      <!-- ===== the trade-off axis ===== -->
      <line x1="40" y1="270" x2="848" y2="270" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="40" y="244" width="190" height="12" rx="2" fill="#f5f5f5"/>
      <text x="40" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SLOWER · SMALLER BLAST RADIUS</text>
      <rect x="620" y="244" width="252" height="12" rx="2" fill="#f5f5f5"/>
      <text x="872" y="253" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">FASTER · WIDER BLAST RADIUS</text>

      <text x="40" y="304" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Each trades speed for safety. The more autonomy, the greater the blast radius of mistakes.</text>
      <text x="40" y="322" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CAROLINE WONG · THE AI CYBERSECURITY HANDBOOK</text>

      <!-- ===== the fixed band ===== -->
      <rect x="40" y="368" width="840" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="368" width="840" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="56" y="360" width="104" height="14" rx="2" fill="#f5f5f5"/>
      <text x="60" y="370" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DOES NOT MOVE</text>
      <text x="60" y="400" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Accountability</text>
      <text x="60" y="422" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Research, analytics and option-generation can be outsourced to AI. Responsibility cannot.</text>

      <!-- ===== legend ===== -->
      <line x1="40" y1="508" x2="920" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="526" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="130" y="516" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="152" y="525" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Human gates or watches the action</text>
      <rect x="380" y="516" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="402" y="525" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Human sees it only afterwards</text>
      <rect x="616" y="516" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="638" y="525" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Fixed regardless of position</text>
      <text x="920" y="525" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">HOOTL = HUMAN-OUT-OF-THE-LOOP</text>
    </svg>
  </div>
</body>
</html>
