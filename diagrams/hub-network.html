<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Network</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · association network</p>
    <h1>The eight most cross-referenced terms form two separate clusters</h1>

    <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hubnet-title hubnet-desc">
      <title id="hubnet-title">Cross-reference clusters among the eight most connected terms</title>
      <desc id="hubnet-desc">The eight terms with the most cross-references in the glossary, with the links that actually run between them. They split into a build cluster of retrieval, prompting and fine-tuning, and an oversight cluster of guardrails, human-in-the-loop and explainability. MLOps is the eighth hub and has no link to any of the other seven.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== zones ===== -->
      <rect x="80" y="98" width="220" height="308" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="96" y="102" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="100" y="111" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BUILD CLUSTER</text>

      <rect x="420" y="98" width="220" height="408" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="436" y="102" width="138" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="111" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OVERSIGHT CLUSTER</text>

      <!-- ===== association links (no arrowheads: undirected) ===== -->
      <!-- build cluster: two adjacent links share x, so plain lines -->
      <line x1="190" y1="186" x2="190" y2="230" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="190" y1="286" x2="190" y2="330" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- RAG to Fine-tuning, routed outside the cluster so it transits no node -->
      <path d="M 100,158 H 68 Q 60,158 60,166 V 350 Q 60,358 68,358 H 100"
            fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- oversight cluster: a chain, all on one x -->
      <line x1="530" y1="186" x2="530" y2="230" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="530" y1="286" x2="530" y2="330" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="530" y1="386" x2="530" y2="430" stroke="#4f5d75" stroke-width="1.2"/>

      <!-- ===== build cluster nodes ===== -->
      <rect x="100" y="130" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="130" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="136" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="260" y="145" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">22</text>
      <text x="114" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">RAG</text>
      <text x="114" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§4 · most connected</text>

      <rect x="100" y="230" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="230" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="236" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="260" y="245" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">19</text>
      <text x="114" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Prompt engineering</text>
      <text x="114" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§3</text>

      <rect x="100" y="330" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="330" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="336" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="260" y="345" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">16</text>
      <text x="114" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Fine-tuning</text>
      <text x="114" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§2</text>

      <!-- ===== oversight cluster nodes ===== -->
      <rect x="440" y="130" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="130" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="588" y="136" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="600" y="145" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">19</text>
      <text x="454" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Agent guardrails</text>
      <text x="454" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§6</text>

      <rect x="440" y="230" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="230" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="588" y="236" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="600" y="245" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">16</text>
      <text x="454" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Human-in-the-loop</text>
      <text x="454" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§6 · cluster centre</text>

      <rect x="440" y="330" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="330" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="588" y="336" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="600" y="345" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">16</text>
      <text x="454" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Explainable AI</text>
      <text x="454" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§11</text>

      <rect x="440" y="430" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="430" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="588" y="436" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="600" y="445" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">18</text>
      <text x="454" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Responsible AI</text>
      <text x="454" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§11</text>

      <!-- ===== the isolated hub ===== -->
      <rect x="740" y="230" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="230" width="180" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="888" y="236" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="900" y="245" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">16</text>
      <text x="754" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">MLOps</text>
      <text x="754" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">§10</text>

      <rect x="740" y="302" width="180" height="46" rx="4" fill="#f5f5f5"/>
      <text x="740" y="314" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">NO LINK TO THE OTHER SEVEN</text>
      <text x="740" y="330" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">16 links elsewhere in the</text>
      <text x="740" y="343" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">glossary, none to a fellow hub.</text>

      <!-- ===== legend ===== -->
      <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="550" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="130" y1="546" x2="154" y2="546" stroke="#4f5d75" stroke-width="1.4"/>
      <text x="164" y="550" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Cross-reference (undirected)</text>
      <rect x="370" y="541" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="392" y="550" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hub term</text>
      <rect x="490" y="541" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="512" y="550" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hub with no peer link</text>
      <rect x="700" y="541" width="18" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="726" y="550" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Badge = total cross-references</text>
      <text x="40" y="580" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace">THE 8 HIGHEST-DEGREE TERMS OF 185, AND ONLY THE 6 LINKS RUNNING BETWEEN THEM. THEIR REMAINING LINKS GO TO NON-HUB TERMS, NOT SHOWN.</text>
    </svg>
  </div>
</body>
</html>
